
<header class="main-header-container">
    <div class="main-header container">
        <h1>
            <a class="main-logo" href="{% url "recipes:home" %}">
                <i class="fas fa-utensils main-logo-icon"></i> 
                <span class="main-logo-text">Receitas</span>
            </a>
        </h1>

        <div class="main-header-account">
            {% if user.is_authenticated %}
                <span>Olá, {{ user.first_name|default:user.username }}</span>
                <a class="main-header-account-link" href="{% url "authors:dashboard" %}">
                    <i class="fas fa-clipboard-list"></i> Meu painel
                </a>
                <form class="main-header-logout" action="{% url "authors:logout" %}" method="POST">
                    {% csrf_token %}
                    <button type="submit" class="main-header-account-link">
                        <i class="fas fa-sign-out-alt"></i> Sair
                    </button>
                </form>
            {% else %}
                <a class="main-header-account-link" href="{% url "authors:login" %}">
                    <i class="fas fa-sign-in-alt"></i> Entrar
                </a>
                <a class="main-header-account-link" href="{% url "authors:register" %}">
                    <i class="fas fa-user-plus"></i> Criar conta
                </a>
            {% endif %}
        </div>

        {% if menu_categories %}
            <nav class="main-nav">
                <a class="main-nav-item" href="{% url "recipes:home" %}">Todas as receitas</a>
                {% for menu_category in menu_categories %}
                    <a class="main-nav-item"
                       href="{% url "recipes:category" menu_category.id %}">{{ menu_category.name }}</a>
                {% endfor %}
            </nav>
        {% endif %}
    </div>
</header>
